events {
    worker_connections 1024;
}

http {
    upstream fastapi_backend {
        server fastapi-app:8000;
    }

    upstream flask_backend {
        server flask-app:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # FastAPI routes
        location /fastapi/ {
            proxy_pass http://fastapi_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flask routes
        location /flask/ {
            proxy_pass http://flask_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default route - shows available APIs
        location / {
            return 200 '{"message": "API Gateway", "available_apis": {"fastapi": "http://localhost/fastapi/", "flask": "http://localhost/flask/"}, "direct_access": {"fastapi": "http://localhost:8000", "flask": "http://localhost:5000"}}';
            add_header Content-Type application/json;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 '{"status": "healthy", "gateway": "nginx"}';
            add_header Content-Type application/json;
        }
    }
}
