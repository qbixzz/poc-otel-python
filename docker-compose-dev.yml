version: '3.8'

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./logs:/var/log/traces
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "13133:13133" # Health check
      - "55679:55679" # zpages extension
    networks:
      - api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3

  fastapi-app:
    build:
      context: ./fastapi-project
      dockerfile: Dockerfile
    container_name: fastapi-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - OTEL_SERVICE_NAME=fastapi-service
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENVIRONMENT=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_HTTP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORT_OTLP=true
      - OTEL_USE_HTTP_EXPORTER=true
      - OTEL_RESOURCE_ATTRIBUTES=service.name=fastapi-service,service.version=1.0.0
    depends_on:
      - otel-collector
    networks:
      - api-network
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  flask-app:
    build:
      context: ./flask-project
      dockerfile: Dockerfile
    container_name: flask-service
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - OTEL_SERVICE_NAME=flask-service
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENVIRONMENT=development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_HTTP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORT_OTLP=true
      - OTEL_USE_HTTP_EXPORTER=true
      - OTEL_RESOURCE_ATTRIBUTES=service.name=flask-service,service.version=1.0.0
    depends_on:
      - otel-collector
    networks:
      - api-network
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  edot-flask-app:
    build:
      context: ./edot-python
      dockerfile: Dockerfile
    container_name: edot-flask-service
    ports:
      - "5001:5001"
    environment:
      - PYTHONPATH=/app
      - FLASK_APP=app.py
      - FLASK_ENV=production
      # EDOT (Elastic Distribution for OpenTelemetry) Configuration
      - OTEL_SERVICE_NAME=edot-flask-api
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=development
      # OTLP Exporter Configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true
      # Logging Configuration
      - OTEL_LOG_LEVEL=info
    depends_on:
      - otel-collector
    networks:
      - api-network
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/health')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

networks:
  api-network:
    driver: bridge

volumes:
  otel-logs:
